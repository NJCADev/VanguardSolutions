# CI: revisa el proyecto en cada Pull Request y en cada push a main.
# Si algo falla, GitHub marca el PR en rojo y evita que lo fusiones por error.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permisos mínimos: este workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: gitleaks lo recorre buscando secretos

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar firebase.json
        run: node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); console.log('firebase.json válido')"

      - name: Revisar sintaxis de JavaScript
        run: |
          for f in main.js */*.js; do
            node --check "$f"
          done

      - name: Revisar traducciones (es / en)
        run: npm run check:i18n

      - name: Probar la generación de config.js (con valores falsos)
        run: node scripts/build-config.js
        env:
          FIREBASE_API_KEY: prueba
          FIREBASE_AUTH_DOMAIN: prueba
          FIREBASE_PROJECT_ID: prueba
          FIREBASE_STORAGE_BUCKET: prueba
          FIREBASE_MESSAGING_SENDER_ID: prueba
          FIREBASE_APP_ID: prueba
          FIREBASE_MEASUREMENT_ID: prueba
          EMAILJS_PUBLIC_KEY: prueba
          EMAILJS_SERVICE_ID: prueba
          EMAILJS_TEMPLATE_ID: prueba

      - name: Buscar secretos en el código y el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
