# Despliegue: cuando se fusiona algo en main, publica el sitio en producción.
name: Desplegar

on:
  push:
    branches: [main]

permissions:
  contents: read

# Si llegan dos pushes seguidos, no despliega a la vez: espera al primero.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
      EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
      EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # Última red de seguridad antes de publicar
      - name: Revisar traducciones
        run: npm run check:i18n

      - name: Generar config.js desde los secretos
        run: node scripts/build-config.js

      - name: Publicar en Firebase Hosting (producción)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VANGUARD_SOLUTIONS_B9509 }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
