# Vista previa: por cada Pull Request publica una copia temporal del sitio en
# una URL de Firebase y la deja como comentario en el PR. Caduca a los 7 días.
name: Vista previa

on:
  pull_request:

permissions:
  contents: read
  checks: write          # para mostrar el resultado en el PR
  pull-requests: write   # para comentar la URL de la vista previa

jobs:
  preview:
    # Los PR que vienen de forks no tienen acceso a los secretos: se omiten.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Los secretos se leen una sola vez y quedan disponibles para todos los pasos.
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
      EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
      EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar config.js desde los secretos
        run: node scripts/build-config.js

      - name: Publicar la vista previa
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VANGUARD_SOLUTIONS_B9509 }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          expires: 7d
