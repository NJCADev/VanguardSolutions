# Vista previa: por cada Pull Request publica una copia temporal del sitio en
# una URL de Firebase y la deja como comentario en el PR. Caduca a los 7 días.
name: Vista previa

on:
  pull_request:

permissions:
  contents: read
  checks: write          # para mostrar el resultado en el PR
  pull-requests: write   # para comentar la URL de la vista previa

jobs:
  preview:
    # Los PR de forks y los de Dependabot no tienen acceso a los secretos de Actions: se omiten.
    # (el check obligatorio "checks" sí corre en ellos)
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Los secretos se leen una sola vez y quedan disponibles para todos los pasos.
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
      EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
      EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
      EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Generar config.js desde los secretos
        run: node scripts/build-config.js

      - name: Publicar la vista previa
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VANGUARD_SOLUTIONS_B9509 }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          expires: 7d
