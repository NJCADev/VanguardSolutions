<header class="site-header" id="site-header">
  <div class="header-inner container">

    <!-- LOGO -->
    <a data-i18n-attr="aria-label:header.001" href="../home/home.html" class="header-logo" aria-label="Vanguard Solutions">
      <div class="logo-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" fill="none" stroke="url(#hexGrad)" stroke-width="1.5"/>
          <polygon points="18,8 28,13 28,23 18,28 8,23 8,13" fill="url(#hexFill)" opacity="0.15"/>
          <text x="18" y="23" text-anchor="middle" font-family="Orbitron,monospace" font-size="11" font-weight="900" fill="url(#hexGrad)">VS</text>
          <defs>
            <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00F0FF"/>
              <stop offset="100%" stop-color="#BF00FF"/>
            </linearGradient>
            <linearGradient id="hexFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00F0FF"/>
              <stop offset="100%" stop-color="#BF00FF"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span data-i18n-html="header.002" class="logo-text">Vanguard<span class="logo-accent">Solutions</span></span>
    </a>

    <!-- DESKTOP NAV -->
    <nav data-i18n-attr="aria-label:header.003" class="header-nav" aria-label="Navegación principal">
      <ul class="nav-list">
        <li><a data-i18n="header.004" href="../home/home.html" class="nav-link" data-page="home">Inicio</a></li>
        <li><a data-i18n="header.005" href="../blogs/blogs.html" class="nav-link" data-page="blogs">Blog</a></li>
        <li><a data-i18n="header.006" href="../services/services.html" class="nav-link" data-page="services">Servicios</a></li>
        <li><a data-i18n="header.007" href="../products/products.html" class="nav-link" data-page="products">Productos</a></li>
        <li><a data-i18n="header.009" href="../contact/contact.html" class="nav-link nav-cta" data-page="contact">Contacto</a></li>
      </ul>
    </nav>

    <!-- LANGUAGE SWITCH -->
    <button type="button" class="lang-switch" id="lang-switch" aria-label="Cambiar idioma a inglés" data-i18n-attr="aria-label:header.lang_aria">
      <i class="fa-solid fa-globe" aria-hidden="true"></i>
      <span data-i18n="header.lang_label">EN</span>
    </button>

    <!-- HAMBURGER (MÓVIL) -->
    <button data-i18n-attr="aria-label:header.010" class="hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-menu">
      <span class="ham-line"></span>
      <span class="ham-line"></span>
      <span class="ham-line"></span>
    </button>
  </div>

  <!-- MOBILE MENU -->
  <div data-i18n-attr="aria-label:header.011" class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menú móvil">
    <nav>
      <ul class="mobile-nav-list">
        <li><a data-i18n="header.004" href="../home/home.html" class="mobile-nav-link" data-page="home">Inicio</a></li>
        <li><a data-i18n="header.005" href="../blogs/blogs.html" class="mobile-nav-link" data-page="blogs">Blog</a></li>
        <li><a data-i18n="header.006" href="../services/services.html" class="mobile-nav-link" data-page="services">Servicios</a></li>
        <li><a data-i18n="header.007" href="../products/products.html" class="mobile-nav-link" data-page="products">Productos</a></li>
        <li><a data-i18n="header.009" href="../contact/contact.html" class="mobile-nav-link mobile-cta" data-page="contact">Contacto</a></li>
      </ul>
    </nav>
  </div>

  <!-- GLOW LINE -->
  <div class="header-glow-line" aria-hidden="true"></div>
</header>
